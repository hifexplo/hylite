# Pipeline that runs tests and, on push to master/dev, publishes docs and wheels to GitHub Pages.

name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".[opencv]"

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q

  publish-site:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    needs: test
    env:
      PAGES_BASE: /${{ github.event.repository.name }}
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: src-master

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: src-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-site-${{ hashFiles('src-master/setup.py', 'src-dev/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-site-
            ${{ runner.os }}-pip-

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pdoc build

      - name: Build stable documentation (master)
        run: |
          # todo remove this after migrating to 1.4
          pip install setuptools
          # todo remove this after migrating to 1.4
          pip install scikit-learn
          pip install -e .
          pdoc hylite --docformat google -o _pdoc_main
        working-directory: src-master

      - name: Build development documentation (dev)
        run: |
          pip install .
          pdoc hylite --docformat google -o _pdoc_dev
        working-directory: src-dev

      - name: Inject version switcher banner
        run: |
          python ci/.github/scripts/inject_docs_banner.py src-master/_pdoc_main stable
          python ci/.github/scripts/inject_docs_banner.py src-dev/_pdoc_dev dev

      - name: Build stable wheel (master)
        run: |
          python -m build
          mkdir -p ../wheels
          cp dist/hylite-*-py3-none-any.whl ../wheels/hylite-latest-py3-none-any.whl
        working-directory: src-master

      - name: Build development wheel (dev)
        run: |
          python -m build
          cp dist/hylite-*-py3-none-any.whl ../wheels/hylite-dev-latest-py3-none-any.whl
        working-directory: src-dev

      - name: Assemble site
        run: |
          mkdir -p _site/dev _site/wheels
          cp -r src-master/_pdoc_main/. _site/
          cp -r src-dev/_pdoc_dev/. _site/dev/
          cp wheels/hylite-latest-py3-none-any.whl _site/wheels/
          cp wheels/hylite-dev-latest-py3-none-any.whl _site/wheels/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    needs: publish-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
